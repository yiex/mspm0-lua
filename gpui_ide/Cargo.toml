[package]
name = "mspm0-lua-ide"
version = "0.2.0"
edition = "2021"
description = "Lua IDE"
license = "MIT"
publish = false

[[bin]]
name = "lua-ide"
path = "src/main.rs"

[[bin]]
name = "fontpack_cli"
path = "src/bin/fontpack_cli.rs"
test = false
bench = false

[dependencies]
anyhow = "1"
gpui = { path = "vendor/gpui" }
parking_lot = "0.12"
raw-window-handle = "0.6"
rfd = "0.15"
serialport = "4.6"
smallvec = "1"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.49", default-features = false }
semver = "1"
sha2 = "0.10"
crc32fast = "1"
fontdb = "0.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
