name: Build firmware

on:
  push:
    branches: [main]
    paths:
      - 'mspm0_lua/**'
      - 'tools/**'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - 'mspm0_lua/**'
      - 'tools/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install pyserial

      - name: Download ARM GNU toolchain
        run: python tools/download_toolchain.py

      - name: Download MSPM0 SDK
        run: python tools/fetch_sdk_zip.py

      - name: Build native modules
        env:
          MSPM0_SDK: ${{ github.workspace }}/tools/mspm0-sdk
          MSPM0_TOOLCHAIN: ${{ github.workspace }}/tools/arm-gnu-toolchain
        run: python tools/build_native_module.py

      - name: Build modular core
        env:
          MSPM0_PROFILE: modular
          MSPM0_SDK: ${{ github.workspace }}/tools/mspm0-sdk
          MSPM0_TOOLCHAIN: ${{ github.workspace }}/tools/arm-gnu-toolchain
        run: python tools/build_fw.py

      - name: Build catalog release
        env:
          MSPM0_SDK: ${{ github.workspace }}/tools/mspm0-sdk
          MSPM0_TOOLCHAIN: ${{ github.workspace }}/tools/arm-gnu-toolchain
        run: python tools/build_catalog_release.py

      - name: Build API metadata
        env:
          MSPM0_SDK: ${{ github.workspace }}/tools/mspm0-sdk
          MSPM0_TOOLCHAIN: ${{ github.workspace }}/tools/arm-gnu-toolchain
        run: python tools/build_api_metadata.py

      - name: Refresh catalog manifest
        env:
          MSPM0_SDK: ${{ github.workspace }}/tools/mspm0-sdk
          MSPM0_TOOLCHAIN: ${{ github.workspace }}/tools/arm-gnu-toolchain
        run: python tools/build_catalog_release.py

      - name: Build protocol fixtures
        env:
          MSPM0_SDK: ${{ github.workspace }}/tools/mspm0-sdk
          MSPM0_TOOLCHAIN: ${{ github.workspace }}/tools/arm-gnu-toolchain
        run: python tools/build_protocol_fixtures.py

      - name: Compose core image
        env:
          MSPM0_SDK: ${{ github.workspace }}/tools/mspm0-sdk
          MSPM0_TOOLCHAIN: ${{ github.workspace }}/tools/arm-gnu-toolchain
        run: |
          # Clean reflash base: modular core plus empty function slots.
          # Individual module images are deployed per slot by the IDE/tools.
          python tools/compose_firmware.py --modules --output mspm0_lua/build_composed/firmware_core.bin

      - name: Build bytecode profile
        env:
          MSPM0_PROFILE: bytecode
          MSPM0_SDK: ${{ github.workspace }}/tools/mspm0-sdk
          MSPM0_TOOLCHAIN: ${{ github.workspace }}/tools/arm-gnu-toolchain
        run: python tools/build_fw.py

      - name: Run host-side regression tests
        env:
          MSPM0_SDK: ${{ github.workspace }}/tools/mspm0-sdk
          MSPM0_TOOLCHAIN: ${{ github.workspace }}/tools/arm-gnu-toolchain
        run: |
          python tools/test_module_catalog.py
          python tools/test_module_update_bundle.py

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mspm0-lua-firmware
          path: |
            mspm0_lua/build_bytecode/*.bin
            mspm0_lua/build_modular/*.bin
            mspm0_lua/build_modules/index.json
            mspm0_lua/build_modules/*/slot*/*.bin
            mspm0_lua/build_composed/*.bin
            mspm0_lua/build_composed/*.json
            mspm0_lua/release/catalog_manifest.json
            mspm0_lua/release/mspm0-lua.api.json
            mspm0_lua/release/test-vectors/*
          if-no-files-found: error
